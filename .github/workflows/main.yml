name: Build Chiaki Ghost Zen Elite Final

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-qt5 mingw-w64-x86_64-openssl
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-hidapi mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-python-setuptools mingw-w64-x86_64-python-protobuf

      - name: Surgical Patch
        run: |
          # 1. Corrige versão do CMake para evitar erros de compatibilidade
          find . -name "CMakeLists.txt" -exec sed -i 's/cmake_minimum_required(VERSION .*/cmake_minimum_required(VERSION 3.10)/' {} +
          
          # 2. BYPASS NA TRAVA DA GUI: Remove o erro fatal por falta de FFmpeg
          sed -i 's/message(FATAL_ERROR "Chiaki GUI requires CHIAKI_ENABLE_FFMPEG_DECODER=ON")/# Trava Ignorada/g' gui/CMakeLists.txt

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCHIAKI_ENABLE_FFMPEG_DECODER=OFF \
                -DCHIAKI_LIB_ENABLE_OPUS=OFF \
                -DCHIAKI_USE_SYSTEM_NANOPB=OFF \
                -DCHIAKI_USE_SYSTEM_JERASURE=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --parallel $(nproc)

      - name: Prepare Package
        run: |
          export PATH="/mingw64/bin:$PATH"
          cd build
          mkdir release_package
          cp gui/chiaki.exe release_package/
          /mingw64/bin/windeployqt-qt5 --release --no-translations --no-compiler-runtime release_package/chiaki.exe
          cp /mingw64/bin/*.dll release_package/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Ghost-Zen-Elite-v4.6
          path: build/release_package/

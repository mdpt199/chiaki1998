name: Build Chiaki Windows Fast

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CACHE: É isso que impede de demorar 2 horas toda vez
      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: |
            C:/vcpkg/installed
            D:/a/chiaki1998/chiaki1998/vcpkg/installed
          key: vcpkg-win-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install Deps
        run: |
          cd C:\vcpkg
          .\vcpkg.exe install qt5-base qt5-svg qt5-multimedia sdl2 openssl opus ffmpeg protobuf --triplet x64-windows

      - name: Configure & Build
        run: |
          mkdir build; cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
                   -DVCPKG_TARGET_TRIPLET=x64-windows `
                   -DCMAKE_POLICY_DEFAULT_CMP0057=NEW `
                   -DCMAKE_CXX_FLAGS="/D_CRT_SECURE_NO_WARNINGS /WX-" `
                   -DCHIAKI_ENABLE_GUI=ON
          cmake --build . --config Release --parallel

      - name: Export
        run: |
          mkdir dist
          copy build\gui\Release\chiaki.exe dist\
          copy C:\vcpkg\installed\x64-windows\bin\*.dll dist\
        
      - uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Recoil-Windows
          path: dist/
          

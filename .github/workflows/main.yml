name: Build Chiaki Ghost Zen (Stub Fix)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-hidapi

      - name: Surgical Patch (Remove PB Files from Build)
        run: |
          # 1. Cria cabeçalhos falsos para o compilador não parar nos #include
          mkdir -p lib/include/nanopb
          touch lib/include/pb.h lib/include/pb_encode.h lib/include/pb_decode.h lib/include/takion.pb.h
          
          # 2. Remove os arquivos que dependem de Protobuf do processo de compilação
          if [ -f lib/CMakeLists.txt ]; then
            sed -i '/src\/senkusha.c/d' lib/CMakeLists.txt
            sed -i '/src\/streamconnection.c/d' lib/CMakeLists.txt
            sed -i 's/add_subdirectory(protobuf)/# /g' lib/CMakeLists.txt
            sed -i 's/chiaki-pb//g' lib/CMakeLists.txt
            sed -i 's/Nanopb::nanopb//g' lib/CMakeLists.txt
          fi

          # 3. Anula a pasta third-party do build
          sed -i 's/add_subdirectory(third-party)/# /g' CMakeLists.txt
          
          # 4. Ajustes MinGW e CMake Version
          find . -name "CMakeLists.txt" -exec sed -i 's/cmake_minimum_required(VERSION .*/cmake_minimum_required(VERSION 3.10)/' {} +
          sed -i 's/WSAGetLastError;/WSAGetLastError();/g' lib/src/ctrl.c
          sed -i 's/&sockerr,/(char*)\&sockerr,/g' lib/src/stoppipe.c
          sed -i '/avcodec_close(decoder->codec_context);/d' lib/src/ffmpegdecoder.c

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCHIAKI_ENABLE_TESTS=OFF \
                -DCHIAKI_ENABLE_CLI=OFF \
                -DCHIAKI_USE_SYSTEM_NANOPB=OFF \
                -DCHIAKI_USE_SYSTEM_JERASURE=OFF \
                -DCHIAKI_ENABLE_FFMPEG_DECODER=OFF \
                -DCHIAKI_LIB_ENABLE_OPUS=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --parallel $(nproc)

      - name: Prepare Package
        run: |
          ln -s /mingw64/bin/qmake-qt5.exe /mingw64/bin/qmake.exe || true
          export PATH="/mingw64/bin:$PATH"
          cd build
          mkdir release_package
          cp gui/chiaki.exe release_package/
          /mingw64/bin/windeployqt-qt5 --release --no-translations --no-compiler-runtime release_package/chiaki.exe || true
          cp /mingw64/bin/*.dll release_package/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Ghost-Zen-Final
          path: build/release_package/

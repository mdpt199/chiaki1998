name: Build Chiaki Ghost Zen (Deep Clean)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-hidapi

      - name: Deep Patch (Kill Protobuf for Good)
        run: |
          # 1. Comenta a linha do Python e do Nanopb no CMake principal
          sed -i 's/find_package(PythonInterp 3 REQUIRED)/# find_package(PythonInterp 3 REQUIRED)/g' CMakeLists.txt
          sed -i 's/add_subdirectory(third-party)/# add_subdirectory(third-party)/g' CMakeLists.txt
          
          # 2. MATA O PROTOBUF DENTRO DA LIB (Resolve o erro atual)
          # No arquivo lib/CMakeLists.txt, removemos a subpasta protobuf
          if [ -f lib/CMakeLists.txt ]; then
            sed -i 's/add_subdirectory(protobuf)/# add_subdirectory(protobuf)/g' lib/CMakeLists.txt
            sed -i 's/chiaki-protobuf//g' lib/CMakeLists.txt
          fi

          # 3. Força a versão do CMake em todos os arquivos
          find . -name "CMakeLists.txt" -exec sed -i 's/cmake_minimum_required(VERSION .*/cmake_minimum_required(VERSION 3.10)/' {} +
          
          # 4. Correções de sintaxe MinGW
          sed -i 's/WSAGetLastError;/WSAGetLastError();/g' lib/src/ctrl.c
          sed -i 's/&sockerr,/(char*)\&sockerr,/g' lib/src/stoppipe.c
          sed -i '/avcodec_close(decoder->codec_context);/d' lib/src/ffmpegdecoder.c

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Desativamos tudo que possa chamar o Protobuf por dependência
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCHIAKI_ENABLE_TESTS=OFF \
                -DCHIAKI_ENABLE_CLI=OFF \
                -DCHIAKI_USE_SYSTEM_NANOPB=OFF \
                -DCHIAKI_USE_SYSTEM_JERASURE=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --parallel $(nproc)

      - name: Prepare Package
        run: |
          ln -s /mingw64/bin/qmake-qt5.exe /mingw64/bin/qmake.exe || true
          export PATH="/mingw64/bin:$PATH"
          cd build
          mkdir release_package
          cp gui/chiaki.exe release_package/
          /mingw64/bin/windeployqt-qt5 --release --no-translations --no-compiler-runtime release_package/chiaki.exe || true
          cp /mingw64/bin/*.dll release_package/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Ghost-Zen-Final
          path: build/release_package/

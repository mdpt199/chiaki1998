name: Build Chiaki Windows (No AV + Recoil)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies via vcpkg
      run: |
        cd C:\vcpkg
        .\vcpkg.exe install qt5-base qt5-svg qt5-multimedia sdl2 openssl opus ffmpeg protobuf --triplet x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        # Forçamos a política CMP0057 para habilitar o operador IN_LIST usado pelo vcpkg
        # E definimos a versão do Python explicitamente para evitar o erro de distutils
        cmake .. `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCMAKE_POLICY_DEFAULT_CMP0057=NEW `
          -DCHIAKI_ENABLE_CLI=ON `
          -DCHIAKI_ENABLE_GUI=ON `
          -Wno-dev

    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Prepare Deployment
      run: |
        mkdir dist
        copy build\gui\Release\chiaki.exe dist\
        copy C:\vcpkg\installed\x64-windows\bin\*.dll dist\
        echo "Build complete. Package is in dist folder."

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chiaki-windows-x64
        path: dist/

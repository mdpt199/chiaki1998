name: Build Chiaki Windows Fast

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Isso garante que o Python 3.11 seja o padrão no PATH
          update-environment-variables: true 
      
      - name: Install Python Deps
        run: |
          python -m pip install --upgrade pip
          pip install protobuf==3.20.* setuptools

      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: |
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-release-v2-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Install Deps
        run: |
          vcpkg install qt5-base qt5-svg qt5-multimedia sdl2 openssl opus ffmpeg protobuf --triplet x64-windows-release

      - name: Configure & Build
        run: |
          # Adicionamos -DCMAKE_POLICY_DEFAULT_CMP0057=NEW para corrigir o erro do FFmpeg
          cmake -B build -G "Ninja" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_DEFAULT_CMP0057=NEW `
            -D_CRT_SECURE_NO_WARNINGS=ON `
            -DCHIAKI_ENABLE_GUI=ON
          
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Export
        run: |
          mkdir dist
          copy build\gui\chiaki.exe dist\
          copy C:\vcpkg\installed\x64-windows-release\bin\*.dll dist\
        
      - uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Windows-Final
          path: dist/

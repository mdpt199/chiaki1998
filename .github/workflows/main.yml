name: Build Chiaki Windows Fast

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. SETUP PYTHON (Correção do erro de 'google' e 'distutils')
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python Deps
        run: |
          python -m pip install --upgrade pip
          pip install protobuf==3.20.* setuptools

      # 2. CACHE INTELIGENTE
      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: |
            C:/vcpkg/installed
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-win-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-win-

      # 3. INSTALAÇÃO (Usando binários se possível para acelerar)
      - name: Install Deps
        run: |
          vcpkg install qt5-base qt5-svg qt5-multimedia sdl2 openssl opus ffmpeg protobuf --triplet x64-windows

      # 4. CONFIGURE & BUILD (Com flags de velocidade)
      - name: Configure & Build
        run: |
          cmake -B build -S . `
                   -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
                   -DVCPKG_TARGET_TRIPLET=x64-windows `
                   -DCMAKE_BUILD_TYPE=Release `
                   -D_CRT_SECURE_NO_WARNINGS=ON `
                   -DCHIAKI_ENABLE_GUI=ON
          
          # Compila usando todos os núcleos disponíveis
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      # 5. EXPORT (Coleta apenas o necessário para o app abrir)
      - name: Export
        run: |
          mkdir dist
          copy build\gui\Release\chiaki.exe dist\
          # Copia apenas as DLLs essenciais para não gerar um arquivo de 2GB
          foreach ($dll in Get-ChildItem "C:\vcpkg\installed\x64-windows\bin\*.dll") {
              copy $dll.FullName dist\
          }
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Windows-Fast
          path: dist/
          

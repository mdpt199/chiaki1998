name: Build Chiaki Ghost Zen Elite

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Baixa as bibliotecas internas

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-hidapi

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCHIAKI_ENABLE_TESTS=OFF \
                -DCHIAKI_ENABLE_CLI=OFF \
                -DCHIAKI_ENABLE_FFMPEG_DECODER=OFF \
                -DCHIAKI_LIB_ENABLE_OPUS=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --parallel $(nproc)

      - name: Prepare Package
        run: |
          export PATH="/mingw64/bin:$PATH"
          cd build
          mkdir release_package
          cp gui/chiaki.exe release_package/
          /mingw64/bin/windeployqt-qt5 --release --no-translations --no-compiler-runtime release_package/chiaki.exe
          cp /mingw64/bin/*.dll release_package/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Ghost-Zen-Elite
          path: build/release_package/

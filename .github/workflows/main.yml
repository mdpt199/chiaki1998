name: Build Chiaki Windows Ultra Fast

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. FORÇAR PYTHON 3.11 (Resolve o erro de 'distutils' e 'google')
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          update-environment-variables: true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install protobuf==3.20.* setuptools

      # 2. CACHE BINÁRIO (Para pular as 2 horas de compilação do Qt5/FFmpeg)
      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: |
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-release-v2-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-release-v2-

      # 3. INSTALAR DEPENDÊNCIAS (Apenas Release para ser mais rápido)
      - name: Install Deps
        run: |
          vcpkg install qt5-base qt5-svg qt5-multimedia sdl2 openssl opus ffmpeg protobuf --triplet x64-windows-release

      # 4. CONFIGURAR E CONSTRUIR (Com travas de segurança e velocidade)
      - name: Configure & Build
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_DEFAULT_CMP0057=NEW `
            -DPython_EXECUTABLE="C:/hostedtoolcache/windows/Python/3.11.9/x64/python3.exe" `
            -D_CRT_SECURE_NO_WARNINGS=ON `
            -DCHIAKI_ENABLE_GUI=ON
          
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      # 5. EXPORTAR (Coleta o EXE e as DLLs necessárias)
      - name: Export
        run: |
          mkdir dist
          if (Test-Path "build/gui/chiaki.exe") { copy build/gui/chiaki.exe dist/ }
          if (Test-Path "build/gui/Release/chiaki.exe") { copy build/gui/Release/chiaki.exe dist/ }
          copy C:\vcpkg\installed\x64-windows-release\bin\*.dll dist/
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Windows-Final
          path: dist/

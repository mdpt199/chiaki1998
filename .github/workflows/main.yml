name: Build Chiaki Ghost Zen (Code Patch Fix)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-hidapi

      - name: Nuclear Patch (Kill Proto from Source)
        run: |
          # 1. Anular os arquivos de CMake do Protobuf/Nanopb
          echo "" > third-party/nanopb/CMakeLists.txt
          echo "" > lib/protobuf/CMakeLists.txt
          
          # 2. COMENTAR INCLUDES NO CÓDIGO FONTE (Resolve o erro fatal atual)
          # Remove includes de takion.pb.h e pb_encode.h
          find lib/src -name "*.c" -o -name "*.h" | xargs sed -i 's/#include <takion.pb.h>/\/\/ #include <takion.pb.h>/g'
          find lib/src -name "*.c" -o -name "*.h" | xargs sed -i 's/#include <pb_encode.h>/\/\/ #include <pb_encode.h>/g'
          find lib/src -name "*.c" -o -name "*.h" | xargs sed -i 's/#include <pb_decode.h>/\/\/ #include <pb_decode.h>/g'
          find lib/src -name "*.c" -o -name "*.h" | xargs sed -i 's/#include "pb_utils.h"/\/\/ #include "pb_utils.h"/g'

          # 3. Limpeza no CMake da LIB
          if [ -f lib/CMakeLists.txt ]; then
            sed -i 's/add_subdirectory(protobuf)/# /g' lib/CMakeLists.txt
            sed -i 's/add_dependencies(chiaki-lib chiaki-pb)/# /g' lib/CMakeLists.txt
            sed -i 's/chiaki-pb//g' lib/CMakeLists.txt
            sed -i 's/Nanopb::nanopb//g' lib/CMakeLists.txt
            sed -i '94s/^/#/' lib/CMakeLists.txt
          fi

          # 4. Ajustes gerais e correções de sintaxe
          sed -i 's/find_package(PythonInterp/#/g' CMakeLists.txt
          find . -name "CMakeLists.txt" -exec sed -i 's/cmake_minimum_required(VERSION .*/cmake_minimum_required(VERSION 3.10)/' {} +
          sed -i 's/WSAGetLastError;/WSAGetLastError();/g' lib/src/ctrl.c
          sed -i 's/&sockerr,/(char*)\&sockerr,/g' lib/src/stoppipe.c
          sed -i '/avcodec_close(decoder->codec_context);/d' lib/src/ffmpegdecoder.c

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCHIAKI_ENABLE_TESTS=OFF \
                -DCHIAKI_ENABLE_CLI=OFF \
                -DCHIAKI_USE_SYSTEM_NANOPB=OFF \
                -DCHIAKI_USE_SYSTEM_JERASURE=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --parallel $(nproc)

      - name: Prepare Package
        run: |
          ln -s /mingw64/bin/qmake-qt5.exe /mingw64/bin/qmake.exe || true
          export PATH="/mingw64/bin:$PATH"
          cd build
          mkdir release_package
          cp gui/chiaki.exe release_package/
          /mingw64/bin/windeployqt-qt5 --release --no-translations --no-compiler-runtime release_package/chiaki.exe || true
          cp /mingw64/bin/*.dll release_package/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Ghost-Zen-Edition
          path: build/release_package/

name: Build Chiaki (No AV Version)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          qtbase5-dev \
          qtchooser \
          qt5-qmake \
          qtbase5-dev-tools \
          libqt5svg5-dev \
          qtmultimedia5-dev \
          libqt5multimedia5-plugins \
          libavcodec-dev \
          libavutil-dev \
          libavformat-dev \
          libswscale-dev \
          libssl-dev \
          libsdl2-dev \
          libopus-dev \
          libevdev-dev \
          libudev-dev \
          protobuf-compiler \
          python3-pip \
          python3-setuptools

    - name: Fix Protobuf Version for Nanopb
      run: |
        # Forçamos a versão 3.20.x do protobuf no python para evitar o erro de 'MakeClass'
        pip3 install "protobuf<4.0.0" --break-system-packages

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCHIAKI_ENABLE_CLI=ON -DCHIAKI_ENABLE_GUI=ON -Wno-dev

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chiaki-linux-build
        path: build/gui/chiaki

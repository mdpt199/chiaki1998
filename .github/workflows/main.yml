name: Build Chiaki Windows (No AV + Recoil)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies via vcpkg
      run: |
        # Usando o vcpkg pré-instalado no runner do GitHub
        cd C:\vcpkg
        .\vcpkg.exe install qt5-base qt5-svg qt5-multimedia sdl2 openssl opus ffmpeg protobuf --triplet x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        # Vinculando o vcpkg ao CMake para encontrar as bibliotecas
        cmake .. `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCHIAKI_ENABLE_CLI=ON `
          -DCHIAKI_ENABLE_GUI=ON `
          -Wno-dev

    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chiaki-windows-x64
        path: build/gui/Release/chiaki.exe

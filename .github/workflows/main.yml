name: Build Chiaki Ghost Zen (No Protobuf Edition)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-hidapi

      - name: Kill Protobuf & Patch Code
        run: |
          # 1. Resolve o erro de versão mínima do CMake
          find . -name "CMakeLists.txt" -exec sed -i 's/cmake_minimum_required(VERSION .*/cmake_minimum_required(VERSION 3.10)/' {} +

          # 2. REMOVE COMPLETAMENTE O NANOPB/PROTOBUF DO BUILD
          # Remove a linha que chama a subpasta do nanopb para evitar o erro de 'protoc'
          sed -i '/add_subdirectory(third-party\/nanopb)/d' CMakeLists.txt
          
          # Remove as dependências de link que pedem o nanopb/protobuf
          sed -i 's/protobuf-nanopb-static//g' CMakeLists.txt
          sed -i 's/nanopb//g' CMakeLists.txt
          
          # 3. Correções de sintaxe para o MinGW
          sed -i 's/WSAGetLastError;/WSAGetLastError();/g' lib/src/ctrl.c
          sed -i 's/&sockerr,/(char*)\&sockerr,/g' lib/src/stoppipe.c
          sed -i '/avcodec_close(decoder->codec_context);/d' lib/src/ffmpegdecoder.c

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Forçamos o CMake a ignorar os componentes que pedem o protobuf
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCHIAKI_ENABLE_TESTS=OFF \
                -DCHIAKI_ENABLE_CLI=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --parallel $(nproc)

      - name: Prepare Package
        run: |
          ln -s /mingw64/bin/qmake-qt5.exe /mingw64/bin/qmake.exe || true
          export PATH="/mingw64/bin:$PATH"
          
          cd build
          mkdir release_package
          cp gui/chiaki.exe release_package/
          
          # Deploy automático das DLLs do Qt (Modo Ghost)
          /mingw64/bin/windeployqt-qt5 --release --no-translations --no-compiler-runtime release_package/chiaki.exe || true
          
          # Garante que todas as DLLs necessárias estejam presentes
          cp /mingw64/bin/*.dll release_package/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Ghost-Zen-NoProto
          path: build/release_package/

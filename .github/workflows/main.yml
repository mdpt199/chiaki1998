name: Build Chiaki Ghost Zen (Zero Protobuf)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-hidapi

      - name: Nuclear Patch (Deletar Protobuf do CMake)
        run: |
          # 1. Remove a busca obrigatória por Python (que o Nanopb exige)
          sed -i '/find_package(PythonInterp 3 REQUIRED)/d' CMakeLists.txt
          
          # 2. Remove a menção ao Nanopb no sistema
          sed -i '/tri_option(CHIAKI_USE_SYSTEM_NANOPB/d' CMakeLists.txt
          sed -i '/if(CHIAKI_USE_SYSTEM_NANOPB)/,/endif()/d' CMakeLists.txt
          
          # 3. Impede o CMake de entrar na pasta third-party/nanopb
          # Deletamos a pasta fisicamente para não ter erro
          rm -rf third-party/nanopb
          
          # 4. Ajusta a versão do CMake para evitar o erro de compatibilidade
          find . -name "CMakeLists.txt" -exec sed -i 's/cmake_minimum_required(VERSION .*/cmake_minimum_required(VERSION 3.10)/' {} +

          # 5. Correções de rede para MinGW
          sed -i 's/WSAGetLastError;/WSAGetLastError();/g' lib/src/ctrl.c
          sed -i 's/&sockerr,/(char*)\&sockerr,/g' lib/src/stoppipe.c
          sed -i '/avcodec_close(decoder->codec_context);/d' lib/src/ffmpegdecoder.c

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          # Desativamos o que depende de Nanopb (Tests e CLI costumam usar)
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCHIAKI_ENABLE_TESTS=OFF \
                -DCHIAKI_ENABLE_CLI=OFF \
                -DCHIAKI_USE_SYSTEM_NANOPB=OFF ..

      - name: Build
        run: |
          cd build
          cmake --build . --parallel $(nproc)

      - name: Prepare Package
        run: |
          ln -s /mingw64/bin/qmake-qt5.exe /mingw64/bin/qmake.exe || true
          export PATH="/mingw64/bin:$PATH"
          cd build
          mkdir release_package
          cp gui/chiaki.exe release_package/
          /mingw64/bin/windeployqt-qt5 --release --no-translations --no-compiler-runtime release_package/chiaki.exe || true
          cp /mingw64/bin/*.dll release_package/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chiaki-Ghost-Zen-Edition
          path: build/release_package/
